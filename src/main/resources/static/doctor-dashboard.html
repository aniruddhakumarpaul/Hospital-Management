<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | LifeCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; }
        .sidebar { background: #1a237e; min-height: 100vh; color: white; padding: 20px; }
        .nav-link { color: rgba(255,255,255,0.7); transition: all 0.3s; margin-bottom: 10px; border-radius: 10px; }
        .nav-link:hover, .nav-link.active { color: white; background: rgba(255,255,255,0.1); }
        .main-content { padding: clamp(15px, 4vw, 30px); }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .mobile-nav { background: #1a237e; color: white; padding: 15px; border-radius: 0 0 20px 20px; margin-bottom: 20px; }

        /* Mobile Scaling Cleanup */
        @media (max-width: 768px) {
            html { font-size: 14px; }
            .main-content { padding: 15px; }
            .card { padding: 1.5rem !important; border-radius: 20px; }
            h2 { font-size: 1.5rem !important; }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar d-none d-md-block">
            <h4 class="mb-5"><i class="fas fa-hospital-user me-2"></i> LifeCare</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-columns me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <!-- Mobile Navigation Fallback -->
            <div class="mobile-nav d-md-none d-flex justify-content-between align-items-center shadow-sm">
                <h5 class="mb-0"><i class="fas fa-hospital-user me-2"></i> LifeCare</h5>
                <button class="btn btn-sm btn-outline-light rounded-pill" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
                <div class="d-flex align-items-center">
                    <a href="index.html" class="btn btn-outline-primary btn-sm rounded-pill me-3"><i class="fas fa-home"></i> Home</a>
                    <h2 class="mb-0 fs-3 fw-bold">Medical Dashboard</h2>
                </div>
                <div class="text-muted"><span id="current-date"></span></div>
            </div>

            <div class="card p-4 border-0 shadow-sm border-start border-danger border-5 mb-4">
                <h5 class="mb-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Emergency Priority</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Record</th>
                                <th>Name</th>
                                <th>Specialist Assigned</th>
                                <th>Symptoms</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="emergencyTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card p-4 border-0 shadow-sm">
                <h5 class="mb-4 text-primary"><i class="fas fa-list-ol me-2"></i>General Queue</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Token</th>
                                <th>Record</th>
                                <th>Name</th>
                                <th>Doctor</th>
                                <th>Specialization</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="generalTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Update Treatment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3"><label>Diagnosis</label><input type="text" id="modalDiagnosis" class="form-control"></div>
                <div class="mb-3">
                    <label>Prescription</label>
                    <textarea id="modalPrescription" class="form-control" rows="4"></textarea>
                </div>
                <div class="mb-3">
                    <label>Follow-up Date <small class="text-muted">(AI Suggested)</small></label>
                    <input type="text" id="modalNextDate" class="form-control" placeholder="dd MMM yyyy">
                </div>
                <input type="hidden" id="modalPatientId">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitTreatmentUpdate()">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const checkAuth = () => { if (localStorage.getItem('doctorLoggedIn') !== 'true') window.location.href = 'doctor-login.html'; };
    checkAuth();
    window.addEventListener('pageshow', (event) => { if (event.persisted || (window.performance && window.performance.navigation.type === 2)) checkAuth(); });
    const API_URL = '/api/patients';
    document.getElementById('current-date').innerText = new Date().toDateString();

    let patientsGlobal = [];

    async function loadPatients() {
        try {
            const response = await fetch(API_URL);
            const patients = await response.json();
            patientsGlobal = patients;
            const emergencyTbody = document.getElementById('emergencyTableBody');
            const generalTbody = document.getElementById('generalTableBody');
            
            emergencyTbody.innerHTML = '';
            generalTbody.innerHTML = '';

            patients.forEach(p => {
                // Logic: Only show patients that are NOT yet TREATED in the dashboard queue
                if (p.status === 'TREATED') return;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong id="p-token"></strong></td>
                    <td><small class="badge bg-light text-dark" id="p-record"></small></td>
                    <td>
                        <div class="fw-bold" id="p-name"></div>
                        <div id="p-ai-hint"></div>
                    </td>
                    <td id="p-doc"></td>
                    <td><span class="badge bg-info-subtle text-info" id="p-dept"></span></td>
                    <td><button class="btn btn-sm btn-primary rounded-pill px-3" id="p-treat-btn">Treat</button></td>
                `;
                
                tr.querySelector('#p-token').textContent = p.isEmergency ? '🚨' : '#' + p.tokenNumber;
                tr.querySelector('#p-record').textContent = p.recordNumber;
                tr.querySelector('#p-name').textContent = p.name;
                tr.querySelector('#p-doc').textContent = p.doctorAssigned;
                tr.querySelector('#p-dept').textContent = p.doctorSpecialization;
                tr.querySelector('#p-treat-btn').onclick = () => openUpdateModalById(p.id);

                if (p.aiSuggestedSpecialization) {
                    const hint = document.createElement('small');
                    hint.className = 'text-info d-block';
                    hint.style.fontSize = '0.7rem';
                    hint.innerHTML = '<i class="fas fa-magic me-1"></i>AI Suggested: ';
                    const hintText = document.createElement('span');
                    hintText.textContent = p.aiSuggestedSpecialization;
                    hint.appendChild(hintText);
                    tr.querySelector('#p-ai-hint').appendChild(hint);
                }

                if (p.isEmergency) {
                    emergencyTbody.appendChild(tr);
                } else {
                    generalTbody.appendChild(tr);
                }
            });

            if (emergencyTbody.innerHTML === '') {
                emergencyTbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No active emergency cases.</td></tr>';
            }
        } catch (e) { 
            console.error("Error loading dashboard", e);
            document.getElementById('generalTableBody').innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-5">
                        <i class="fas fa-wifi text-danger mb-2 fa-2x"></i>
                        <div class="text-danger fw-bold">System Connection Error</div>
                        <div class="text-muted small">Could not reach medical database. Please check your network.</div>
                        <button class="btn btn-sm btn-outline-primary mt-3" onclick="loadPatients()">Retry Connection</button>
                    </td>
                </tr>
            `;
        }
    }

    function openUpdateModalById(id) {
        const p = patientsGlobal.find(i => i.id == id);
        if (!p) return;
        document.getElementById('modalPatientId').value = p.id;
        document.getElementById('modalDiagnosis').value = p.predictedDisease;
        document.getElementById('modalPrescription').value = p.prescription || "";
        document.getElementById('modalNextDate').value = p.nextAppointmentDate || "";
        new bootstrap.Modal(document.getElementById('updateModal')).show();
    }

    async function submitTreatmentUpdate() {
        const id = document.getElementById('modalPatientId').value;
        const saveBtn = document.querySelector('button[onclick="submitTreatmentUpdate()"]');
        
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    predictedDisease: document.getElementById('modalDiagnosis').value, 
                    prescription: document.getElementById('modalPrescription').value,
                    nextAppointmentDate: document.getElementById('modalNextDate').value
                })
            });
            
            if (!response.ok) throw new Error("Update failed");
            
            bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();
            await loadPatients();
        } catch (e) {
            alert("Error: Database could not be updated. Please try again.");
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = 'Save Changes';
        }
    }

    function logout() { localStorage.removeItem('doctorLoggedIn'); window.location.href = 'doctor-login.html'; }
    loadPatients();
</script>
<footer>
    <div class="container text-center">
        <p class="mb-4">&copy; 2026 LifeCare AI. Premium Healthcare Solutions.</p>
        
        <div class="mt-4 pt-4 border-top border-secondary">
            <a href="https://www.linkedin.com/in/aniruddha-paul-a92971317" target="_blank" class="dev-signature-btn">
                <span class="label">Made By</span>
                <span class="name">Aniruddha Paul</span>
                <i class="fab fa-linkedin ms-2"></i>
            </a>
        </div>
    </div>
</footer>

<style>
    .dev-signature-btn {
        display: inline-flex;
        align-items: center;
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        color: #fff;
        text-decoration: none !important;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        backdrop-filter: blur(5px);
        margin-bottom: 20px;
    }
    .dev-signature-btn .label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.7;
        margin-right: 8px;
    }
    .dev-signature-btn .name {
        font-weight: 600;
        background: linear-gradient(135deg, #0061f2, #00ba94);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .dev-signature-btn:hover {
        transform: translateY(-5px) scale(1.05);
        background: rgba(255, 255, 255, 0.1);
        border-color: #00ba94;
        box-shadow: 0 10px 30px rgba(0, 186, 148, 0.2);
    }
    .dev-signature-btn:active {
        transform: scale(0.95);
    }
    .dev-signature-btn i {
        color: #00ba94;
        font-size: 1.2rem;
    }
    
    footer {
        background: #121212;
        color: #fff;
        padding: 60px 0 30px;
        margin-top: 50px;
    }
</style>
</body>
</html>
